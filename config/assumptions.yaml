# ClaimPilot — simulation assumptions and operating rules
# =============================================================================
# EVERY number in this file is ILLUSTRATIVE and SIMULATED unless marked
# "source: dataset". Nothing here is calibrated to a real insurer's portfolio.
# The app surfaces these values so a reviewer can see exactly what is invented.
# =============================================================================

meta:
  carrier_name: "Northwind Mutual"          # fictional carrier
  carrier_naic_mock: "99999"                # not a real NAIC number
  lob: "Personal Auto — Physical Damage & Liability"
  random_seed: 20250117                     # all simulation is deterministic
  version: "0.1.0"

dataset:
  name: "insurance_claims.csv"
  source: "Mendeley Data"
  doi: "10.17632/992mh7dk9y.2"
  url: "https://data.mendeley.com/datasets/992mh7dk9y/2"
  license: "CC BY 4.0"
  attribution: "Aqqad, Abdelrahim (2023), insurance_claims, Mendeley Data, V2, doi: 10.17632/992mh7dk9y.2"
  rows_expected: 1000
  # Honest limitations, repeated in the README and PRD:
  limitations:
    - "~1,000 claims only. Far too small to calibrate production thresholds."
    - "Fraud rate is ~25%, roughly 10-25x higher than a real auto portfolio
       (industry estimates put auto claim fraud in the low single digits).
       Any threshold here would need full recalibration for a real carrier."
    - "Incident dates cluster in Jan-Mar 2015; seasonality cannot be modeled."
    - "Geography is limited to a handful of states (OH, IN, IL) and
       synthetic-looking city names."
    - "'fraud_reported' is a *reported* flag, not an adjudicated fraud finding.
       It is a proxy label and inherits whatever bias the original process had."

# -----------------------------------------------------------------------------
# Fields deliberately EXCLUDED from every model input.
# Outcomes are still tested across these groups in the fairness check.
# -----------------------------------------------------------------------------
protected_and_excluded_fields:
  excluded_from_models:
    - insured_sex                 # protected characteristic
    - age                         # protected characteristic (age band)
    - insured_education_level     # strong socio-economic proxy
    - insured_occupation          # socio-economic proxy
    - insured_relationship        # marital/family status proxy
    - insured_zip                 # geographic proxy for race/income (redlining risk)
    - insured_hobbies             # leaks label in this dataset; also arbitrary
    - policy_number               # identifier, no predictive meaning
    - incident_location           # free-text street address
  rationale: >
    Protected characteristics and close proxies are withheld from model inputs
    to avoid direct discrimination. Exclusion alone does not guarantee fairness,
    so STP and SIU rates are monitored across these same groups (see fairness).
  fairness_test_groups:
    - region                      # derived from incident_state
    - age_band                    # derived from age
    - vehicle_category            # derived from auto_make
    - insured_sex

# -----------------------------------------------------------------------------
# Claim-handling deadlines — ILLUSTRATIVE ONLY.
# Real deadlines are set by state unfair-claims-practices regulations and vary
# materially by state and claim type. These are placeholder values for the demo.
# -----------------------------------------------------------------------------
deadlines:
  label: "ILLUSTRATIVE — not state-specific; real rules vary by jurisdiction"
  basis: "Loosely patterned on common US unfair claims settlement practice norms"
  acknowledge_days: 10            # acknowledge receipt of the claim
  decide_days: 30                 # accept or deny after receiving proof of loss
  pay_days: 10                    # pay after accepting
  at_risk_threshold_pct: 80       # flag "at risk" once 80% of the clock is used
  business_days_only: false       # simplification: calendar days

# -----------------------------------------------------------------------------
# Simulated adjuster handling time (hours of touch time per claim).
# Lognormal-ish draws around these means. SIMULATED.
# -----------------------------------------------------------------------------
handling_time_hours:
  label: "SIMULATED"
  manual_baseline:                # the "everything manual" comparison arm
    low_severity: 2.5
    medium_severity: 6.0
    high_severity: 14.0
    siu_referral_extra: 10.0
    sigma: 0.35                   # lognormal shape; dispersion of touch time
  claimpilot:
    stp_auto_approved: 0.1        # near-zero human touch on fast-tracked claims
    adjuster_assisted_multiplier: 0.78   # copilot saves ~22% of touch time
    siu_referral_extra: 10.0
    sigma: 0.35
  assumption_note: >
    The 22% assisted-handling saving is a demo placeholder chosen to be
    deliberately conservative. It is NOT measured from real adjuster data and
    must not be read as a validated efficiency claim.

# -----------------------------------------------------------------------------
# Simulated cost model — loss adjustment expense (LAE). SIMULATED.
# -----------------------------------------------------------------------------
costs:
  label: "SIMULATED"
  adjuster_cost_per_hour_usd: 85       # fully loaded adjuster cost
  siu_investigator_cost_per_hour_usd: 110
  fixed_cost_per_claim_usd: 40         # intake, systems, correspondence
  stp_system_cost_per_claim_usd: 6     # automated processing cost
  currency: "USD"

# -----------------------------------------------------------------------------
# Simulated cycle time (calendar days from FNOL to close). SIMULATED.
# -----------------------------------------------------------------------------
cycle_time_days:
  label: "SIMULATED"
  manual_baseline:
    low_severity: 11.0
    medium_severity: 21.0
    high_severity: 38.0
    siu_referral_extra: 22.0
    sigma: 0.30
  claimpilot:
    stp_auto_approved: 0.5             # same-day fast-track
    adjuster_assisted_multiplier: 0.82
    siu_referral_extra: 22.0
    sigma: 0.30
  time_to_first_contact_hours:
    manual_baseline: 26.0
    claimpilot: 2.0
    note: "Digital FNOL acknowledges immediately; manual arm waits for a callback."

# -----------------------------------------------------------------------------
# Claim leakage — the estimated overpayment vs. what should have been paid.
# SIMULATED and crude: a demo stand-in for a real leakage study.
# -----------------------------------------------------------------------------
leakage:
  label: "SIMULATED — crude proxy, not a leakage study"
  manual_missed_fraud_rate: 0.55        # share of fraud-flagged claims paid in full
  claimpilot_missed_fraud_rate: 0.38    # improved by triage, still far from zero
  stp_overpayment_rate: 0.02            # cost of fast-tracking without review
  reopen_rate_manual: 0.085
  reopen_rate_claimpilot: 0.065
  note: >
    Leakage here is modeled, not observed. A real carrier measures it with
    file reviews and round-table audits. Treat the direction as illustrative
    and the magnitude as meaningless.

# -----------------------------------------------------------------------------
# Mock policy generation — fake coverage terms attached to each real claim row.
# -----------------------------------------------------------------------------
mock_policy:
  label: "SIMULATED"
  expired_policy_rate: 0.04        # share of claims whose loss falls outside coverage
  lapsed_grace_days: 15
  term_months: 12
  coverage_types:
    - "Comprehensive + Collision + Liability"
    - "Collision + Liability"
    - "Liability Only"
  liability_only_rate: 0.07        # these create genuine coverage questions
  policy_number_prefix: "NWM"

# -----------------------------------------------------------------------------
# Fake policyholder contact details — used ONLY to demo PII masking.
# No real people. Names drawn from a small fixed synthetic list.
# -----------------------------------------------------------------------------
mock_contact:
  label: "SIMULATED — fictional people, generated for the masking demo"
  email_domain: "example.com"      # RFC 2606 reserved, never deliverable
  phone_area_codes: [555]          # 555 is reserved for fiction
  note: "Contact details exist so the PII-masking demo has something to mask."

# -----------------------------------------------------------------------------
# Narrative generation — FNOL free-text built from each row's real fields.
# Ground truth is retained so extraction accuracy can be measured.
# -----------------------------------------------------------------------------
narratives:
  label: "SIMULATED"
  count: 1000                      # one per claim row
  include_pii_rate: 0.45           # share of narratives that embed contact details
  omit_field_rate: 0.18            # realistic incompleteness for the extractor
  vague_amount_rate: 0.25          # "a few thousand dollars" instead of a figure

# -----------------------------------------------------------------------------
# Fraud model — feature policy and threshold.
# The allow-list is explicit: a field must be named here to reach the model.
# Anything not listed is excluded by default, which is the safer direction.
# -----------------------------------------------------------------------------
fraud_model:
  label: "Trained on the real fraud_reported flag (a reported flag, not an adjudicated finding)"
  algorithm: "HistGradientBoostingClassifier"
  test_size: 0.25
  cv_folds: 5
  # Tuned against SIU capacity, not against F1.
  threshold: 0.35
  siu_capacity_share: 0.25      # SIMULATED: share of claims SIU can review
  threshold_rationale: >
    Chosen to maximise recall subject to the referral rate staying within the
    assumed SIU capacity of 25% of claims. F1 is actually higher at a 0.20
    threshold (0.61 vs 0.56), but that flags 33% of all claims for
    investigation, which no SIU function could absorb. Capacity is the binding
    constraint in claims operations, so the threshold is set against capacity
    and the cost of a missed fraud, not against a balanced score.
    On a real portfolio this would be re-tuned continuously against measured
    SIU hit rate and actual capacity, and the much lower real-world base rate
    would push the referral rate far below this.
  numeric_features:
    - months_as_customer
    - policy_deductable
    - policy_annual_premium
    - umbrella_limit
    - csl_per_person_usd
    - csl_per_occurrence_usd
    - incident_hour_of_the_day
    - number_of_vehicles_involved
    - bodily_injuries
    - witnesses
    - total_claim_amount
    - injury_claim
    - property_claim
    - vehicle_claim
    - vehicle_age_years
  categorical_features:
    - incident_type
    - collision_type
    - incident_severity
    - authorities_contacted
  boolean_features:
    - missing_police_report
    - missing_property_damage_info
  # Deliberately NOT model inputs, beyond the protected list above:
  additional_exclusions:
    incident_state: "geographic proxy; outcomes are tested by region instead"
    incident_city: "geographic proxy, and synthetic in this dataset"
    auto_make: "wealth proxy; outcomes are tested by vehicle category instead"
    capital_gains: "socio-economic proxy"
    capital_loss: "socio-economic proxy"
    injury_claim_share: "mechanical function of total_claim_amount; leaks nothing useful"

# -----------------------------------------------------------------------------
# Triage scoring. Bands and weights are deliberately simple and legible:
# an adjuster or a regulator must be able to follow why a claim scored as it
# did, which matters more here than squeezing out predictive performance.
# -----------------------------------------------------------------------------
triage:
  severity:
    # Expected-cost bands in USD, from the claim amount.
    # Calibrated to this dataset's distribution (median ~$58k), which is itself
    # unusual; a real carrier would band against its own severity curve.
    low_max_usd: 25000
    medium_max_usd: 60000
    # Above medium_max_usd is High.
    total_loss_forces_high: true

  complexity:
    # Points, summed then banded. Each carries a reason code.
    points:
      injury_reported: 3
      multiple_injuries: 2          # on top of injury_reported
      multi_party: 2
      many_vehicles: 1              # 3 or more
      missing_police_report: 1
      missing_property_damage_info: 1
      coverage_question: 3
      coverage_not_in_force: 4
      no_witnesses_disputed: 1
      high_value: 2                 # above severity.medium_max_usd
    # Calibrated against the observed points distribution on this dataset so
    # the bands split roughly 25% / 44% / 31%. An earlier 2/5 split pushed 55%
    # of claims into High, which would send most of the book to senior
    # adjusters and defeat the point of triage.
    low_max_points: 3
    medium_max_points: 7
    # Above medium_max_points is High.

  fraud:
    # Model probability bands.
    low_max: 0.20
    medium_max: 0.35               # aligned with fraud_model.threshold
    # Red-flag rules run alongside the model and carry their own reason codes.
    # These are classic P&C indicators, kept few and legible on purpose.
    red_flags:
      late_night_incident:
        hours: [0, 1, 2, 3, 4]
        points: 1
      no_police_report_high_value:
        min_amount_usd: 50000
        points: 2
      recent_policy_short_tenure:
        max_months_as_customer: 6
        points: 2
      no_witnesses_no_report:
        points: 1
      high_claim_low_premium:
        ratio: 40                   # claim / annual premium
        points: 1
    # Red-flag points needed to escalate the band by one level.
    escalate_band_at_points: 3

# -----------------------------------------------------------------------------
# Reserve model — expected ultimate cost of the claim, with a range.
# Target is total_claim_amount. The amount components (injury/property/vehicle
# claim) are EXCLUDED as features: they are parts of the target and would leak
# it almost perfectly, producing a model that looks flawless and predicts
# nothing useful at FNOL, when those components are not yet known.
# -----------------------------------------------------------------------------
reserve_model:
  label: "Trained on real claim amounts from the dataset"
  algorithm: "GradientBoostingRegressor (quantile loss)"
  target: total_claim_amount
  test_size: 0.25
  # Quantiles give the adjuster a range, not false precision.
  quantiles:
    low: 0.10
    point: 0.50
    high: 0.90
  features:
    - incident_type
    - collision_type
    - incident_severity
    - authorities_contacted
    - bodily_injuries
    - number_of_vehicles_involved
    - witnesses
    - incident_hour_of_the_day
    - vehicle_age_years
    - policy_deductable
    - csl_per_person_usd
    - csl_per_occurrence_usd
    - missing_police_report
    - missing_property_damage_info
  leakage_exclusions:
    total_claim_amount: "the target itself"
    injury_claim: "a component of the target"
    property_claim: "a component of the target"
    vehicle_claim: "a component of the target"
    injury_claim_share: "a mechanical function of the target"
  reserve_note: >
    The reserve suggestion comes from this model, never from the language
    model. An LLM may describe a reserve but must never originate a number.

# -----------------------------------------------------------------------------
# Adjuster workbench: queue prioritisation and decision controls.
# -----------------------------------------------------------------------------
workbench:
  # Priority score = weighted sum, higher is more urgent. SIMULATED weights.
  label: "SIMULATED prioritisation weights"
  priority_weights:
    severity_high: 30
    severity_medium: 15
    deadline_breached: 40
    deadline_at_risk: 25
    fraud_high: 20
    fraud_medium: 8
    complexity_high: 10
    age_days_multiplier: 0.8      # points per day since the loss was reported
    coverage_problem: 12
  # "Today" for the demo. The dataset's losses are Jan-Mar 2015, so a real
  # current date would make every claim catastrophically overdue and the
  # deadline tracker meaningless.
  demo_today: "2015-03-15"
  demo_today_note: >
    Fixed demo date, chosen because the dataset's losses fall in Jan-Mar 2015.
    Using the real current date would mark every claim a decade overdue.

  # Reason codes required on an adverse or deferring decision.
  decision_reason_codes:
    deny:
      - DENY_NO_COVERAGE: "No coverage in force at the date of loss"
      - DENY_EXCLUSION: "Loss falls under a policy exclusion"
      - DENY_MATERIAL_MISREP: "Material misrepresentation established"
      - DENY_NOT_COVERED_PERIL: "Peril is not covered by this policy form"
      - DENY_FAILURE_TO_COOPERATE: "Insured failed to cooperate with the investigation"
      - DENY_OTHER: "Other (explain in the note)"
    escalate:
      - ESC_SUSPECTED_FRAUD: "Indicators suggest possible fraud"
      - ESC_COMPLEX_LIABILITY: "Liability is disputed or unclear"
      - ESC_LARGE_EXPOSURE: "Exposure exceeds adjuster authority"
      - ESC_OTHER: "Other (explain in the note)"
    request_info:
      - INFO_POLICE_REPORT: "Police report required"
      - INFO_MEDICAL_RECORDS: "Medical records required"
      - INFO_REPAIR_ESTIMATE: "Repair estimate required"
      - INFO_PROOF_OF_LOSS: "Signed proof of loss required"
      - INFO_OTHER: "Other (explain in the note)"
  # A denial note must be substantive, not a single character.
  min_denial_note_chars: 20

