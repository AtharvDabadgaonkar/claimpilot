# Hand-written FNOL descriptions that deliberately do NOT follow the phrasing
# used by scripts/simulate.py.
#
# Why this file exists: the generated corpus was written from templates, and
# the rule-based extractor was written against those templates. Scoring it on
# that corpus is close to circular and will flatter it. These cases are the
# honest check — messy, abbreviated, differently worded claimant text — and the
# accuracy measured here is the number that actually says something about
# robustness.
#
# `expect` holds only what the text genuinely states. Where a field is absent
# the expected value is null, because refusing to guess is correct behaviour.

- id: held-01
  note: lowercase, no punctuation, texting style
  text: >-
    rear ended on the 405 on march 3 2015 in torrance CA nobody hurt
    cops didnt come my 2013 honda accord has maybe $2,400 of damage
  expect:
    loss_type: Multi-vehicle Collision
    collision_type: Rear Collision
    injury_reported: false
    num_injured: 0
    police_report_available: false
    city: null
    state: null
    auto_make: Honda
    auto_year: 2013
    estimated_amount_usd: 2400.0

- id: held-02
  note: formal, spelled-out numbers, ISO date
  text: >-
    On 2015-02-11 in Columbus, OH my vehicle was struck on the side by another
    car. Two people were injured and an ambulance attended. The police filed a
    report. There were three witnesses. The vehicle is a 2011 Toyota Camry.
  expect:
    loss_type: Multi-vehicle Collision
    collision_type: Side Collision
    injury_reported: true
    num_injured: 2
    police_report_available: true
    witnesses: 3
    city: Columbus
    state: OH
    auto_make: Toyota
    auto_year: 2011

